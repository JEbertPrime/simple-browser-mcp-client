name: Publish to npm

on:
  release:
    types: [published]

  push:
    branches:
      - 2026-07-28

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (pack but do not publish)"
        type: boolean
        default: false
      publish_target:
        description: "Manual target"
        type: choice
        options:
          - stable
          - draft
        default: draft

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  DRAFT_BRANCH: "2026-07-28"
  DRAFT_DIST_TAG: "draft-2026-07-28"

jobs:
  publish_stable:
    name: Publish stable release
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'stable')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Pack (dry-run inspection)
        run: npm pack --dry-run

      - name: Publish stable package
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
